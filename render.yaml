# Render blueprint: New > Blueprint > pick this repo and branch. Free plan; the app sleeps when idle.
# The database lives on the container's disk, so it resets (with fresh demo data) on each deploy or restart.
services:
  - type: web
    name: sabeeli
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_DEMO
        value: "1"
      - key: DEMO_PASSWORD
        value: sabeeli-demo
      - key: SABEELI_OFFLINE
        value: "1"          # set to 0 and add ANTHROPIC_API_KEY to use the model
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
