# Render blueprint: New > Blueprint > pick this repo and branch. Free plan; the app sleeps when idle.
# The database lives on the container's disk, so it resets (with fresh demo data) on each deploy or restart.
services:
  - type: web
    name: sabeeli
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_DEMO
        value: "1"
      - key: DEMO_PASSWORD
        value: sabeeli-demo
      - key: SABEELI_OFFLINE
        value: "0"          # without a key below the app still runs, in sources-only mode
      - key: OPENROUTER_API_KEY
        sync: false         # Gemma 4 31B through OpenRouter (the default model); paste the key in Render
      - key: ANTHROPIC_API_KEY
        sync: false         # only with SABEELI_LLM_PROVIDER=anthropic
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
