  <script>
    // apply the saved theme and language before first paint
    try {
      var th = localStorage.getItem("sabeeli.theme");
      if (th && th !== "auto") document.documentElement.setAttribute("data-theme", th);
      var lg = localStorage.getItem("sabeeli.lang");
      if (lg === "en") { document.documentElement.lang = "en"; document.documentElement.dir = "ltr"; }
    } catch (e) {}
  </script>

  <div id="app" class="app"></div>
